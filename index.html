
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#247a59">
<title>Expiry Reminder</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f4f7f2;color:#26372e}
header{background:#247a59;color:white;padding:22px;border-radius:18px}
h1{margin:0 0 6px;font-size:26px}
header p{margin:0;opacity:.9}
.card{background:white;padding:16px;border-radius:16px;margin-top:16px;box-shadow:0 2px 10px #0000000c}
input,select,button{width:100%;padding:12px;margin:6px 0;border:1px solid #d8e1d9;border-radius:10px;font-size:16px}
button{background:#247a59;color:white;border:0;font-weight:bold}
button.secondary{background:#e8f1eb;color:#247a59}
.item{border:1px solid #e2e9e3;padding:12px;border-radius:12px;margin-top:10px}
.item img{width:65px;height:65px;object-fit:cover;border-radius:10px;float:right}
.small{font-size:13px;color:#66756b}
.danger{color:#b33}
</style>
</head>
<body>
<header>
<h1>Expiry Reminder</h1>
<p>Keep track. Waste less.</p>
</header>

<div class="card">
<h3>Your items</h3>
<div id="stats"></div>
<input id="search" placeholder="Search products..." oninput="render()">
<select id="filter" onchange="render()">
<option value="All">All items</option>
<option value="Personal">Personal</option>
<option value="Family">Family</option>
<option value="Consumed">Consumed</option>
</select>
<div id="items"></div>
</div>

<div class="card">
<h3>Add a product</h3>
<input id="name" placeholder="Product name">
<select id="category">
<option>Food</option><option>Drinks</option><option>Medicine</option>
<option>Skincare</option><option>Household</option><option>Other</option>
</select>
<select id="scope">
<option>Personal</option><option>Family</option>
</select>
<label class="small">Expiry date</label>
<input id="date" type="date">
<input id="quantity" type="number" min="1" value="1" placeholder="Quantity">
<input id="photo" type="file" accept="image/*">
<button onclick="addItem()">Add item</button>
</div>

<script>
let data=JSON.parse(localStorage.getItem("expiryItems")||"[]");

function save(){
 localStorage.setItem("expiryItems",JSON.stringify(data));
 render();
}

function daysLeft(date){
 const today=new Date();
 today.setHours(0,0,0,0);
 const expiry=new Date(date+"T00:00:00");
 return Math.ceil((expiry-today)/86400000);
}

function addItem(){
 const name=document.getElementById("name").value.trim();
 const date=document.getElementById("date").value;
 if(!name||!date){alert("Please enter a product name and expiry date.");return;}
 const file=document.getElementById("photo").files[0];
 const item={
  id:Date.now(),name,
  category:document.getElementById("category").value,
  scope:document.getElementById("scope").value,
  date,quantity:document.getElementById("quantity").value||1,
  photo:"",consumed:false
 };
 function finish(){data.push(item);save();document.getElementById("name").value="";document.getElementById("date").value="";document.getElementById("photo").value="";}
 if(file){
  const reader=new FileReader();
  reader.onload=()=>{item.photo=reader.result;finish();};
  reader.readAsDataURL(file);
 }else finish();
}

function consume(id){
 const item=data.find(x=>x.id===id);
 if(item){item.consumed=true;save();}
}
function removeItem(id){
 if(confirm("Delete this item?")){data=data.filter(x=>x.id!==id);save();}
}

function render(){
 const search=document.getElementById("search").value.toLowerCase();
 const filter=document.getElementById("filter").value;
 const active=data.filter(x=>!x.consumed);
 const soon=active.filter(x=>daysLeft(x.date)>=0&&daysLeft(x.date)<=7).length;
 const expired=active.filter(x=>daysLeft(x.date)<0).length;
 document.getElementById("stats").innerHTML=
  `Active: ${active.length} · Expiring within 7 days: ${soon} · Expired: ${expired}`;
 const list=data.filter(x=>{
  const matches=x.name.toLowerCase().includes(search);
  const category=filter==="All"||(filter==="Consumed"?x.consumed:!x.consumed&&x.scope===filter);
  return matches&&category;
 });
 document.getElementById("items").innerHTML=list.map(x=>{
  const days=daysLeft(x.date);
  const status=x.consumed?"Consumed":days<0?`Expired ${Math.abs(days)} day(s) ago`:days===0?"Expires today":`${days} day(s) left`;
  return `<div class="item">
  ${x.photo?`<img src="${x.photo}">`:""}
  <b>${escapeText(x.name)}</b>
  <div class="small">${x.category} · ${x.scope} · Qty: ${x.quantity}</div>
  <div class="${!x.consumed&&days<0?"danger":""}">${status}</div>
  <div class="small">Expiry: ${x.date}</div>
  ${!x.consumed?`<button class="secondary" onclick="consume(${x.id})">Mark consumed</button>`:""}
  <button class="secondary" onclick="removeItem(${x.id})">Delete</button>
  <div style="clear:both"></div>
  </div>`;
 }).join("")||"<p class='small'>No items found. Add your first product below.</p>";
}
function escapeText(s){
 return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
render();
</script>
</body>
</html>
